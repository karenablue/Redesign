<!-- Custom "three women" icon for Lifetime Members, drawn for this site to match
     the Phosphor duotone set beside it: 256 grid, 13-unit round strokes (optically matches the set's 16: the figures are denser), a
     20% fill layer (.icon-fill, tinted gold by the page). The two sorors
     behind are drawn at 80% (stroke 16, so it renders at 13) and the centre
     figure masks them with the card's white. Not from Phosphor. -->
