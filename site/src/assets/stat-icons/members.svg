  <path d="M114,204V228M142,204V228M102,108L82,150M154,108L174,150" />
<!-- Ten pearls and two rubies (Karena, 2026-09-26): a pearl necklace and
       ruby earrings on the front soror. Ruby is outside the royal/gold/white
       palette; it is limited to these two marks (class .icon-ruby). -->
  <g class="icon-pearl" fill="#fff" stroke="currentColor" stroke-width="3">
    <circle cx="110.0" cy="96.0" r="4.5" />
    <circle cx="114.0" cy="102.3" r="4.5" />
